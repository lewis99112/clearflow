    function setupRoundAutoFill(formId, currentJobId) {
      const form = $(formId);
      if (!form) return;
      const isEditingJob = !!currentJobId;

      const roundSelect = form.querySelector('[name="roundId"]');
      const customerSelect = form.querySelector('[name="customerId"]');
      const dueInput = form.querySelector('[name="dueDate"]');
      const paymentSelect = form.querySelector('[name="paymentMethod"]');
      const hint = form.querySelector("[data-round-hint]");

      function updateFromRound(allowDateChange) {
        const roundId = roundSelect ? roundSelect.value : "";
        if (!roundId) {
          if (hint) hint.textContent = "No round selected.";
          return;
        }

        const nextDate = getNextDateForRound(roundId, currentJobId || "");
        const count = getFutureJobsForRound(roundId, currentJobId || "").length;

        if (hint) {
          hint.textContent = nextDate
            ? "Next round date: " + formatDate(nextDate) + " (" + count + " job" + (count === 1 ? "" : "s") + ")"
            : "No future jobs found in this round yet.";
        }

        if (!isEditingJob && allowDateChange && nextDate && dueInput) dueInput.value = nextDate;
      }

      if (customerSelect && roundSelect) {
        customerSelect.addEventListener("change", () => {
          const c = getCustomerById(customerSelect.value);
          if (c && c.roundId) roundSelect.value = c.roundId;
          if (c && paymentSelect) paymentSelect.value = normalizePaymentMethod(c.preferredPayment || "Cash");
          updateFromRound(true);
        });
      }

      if (roundSelect) roundSelect.addEventListener("change", () => updateFromRound(true));
      updateFromRound(false);
    }

    function previewScheduleDates(dueDate, frequencyWeeks, count) {
      const frequency = Number(frequencyWeeks || 0);
      if (!dueDate) return [];
      const dates = [dueDate];
      if (!frequency) return dates;

      let cursor = dueDate;
      let guard = 0;
      while (dates.length < (count || 5) && guard < 24) {
        cursor = nextDueDate({
          dueDate: cursor,
          frequencyWeeks: frequency,
          recurrenceDay: recurrenceDayFor(frequency, dueDate)
        });
        if (!cursor) break;
        dates.push(cursor);
        guard++;

    function renderCustomers() {
      let list = customers.slice();

      if (customerFilter === "active") list = list.filter(c => c.active !== false);
      if (customerFilter === "inactive") list = list.filter(c => c.active === false);

      if (customerSearch.trim()) {
        const q = customerSearch.toLowerCase();
        list = list.filter(c =>
          String(c.name || "").toLowerCase().includes(q) ||
          String(c.address || "").toLowerCase().includes(q) ||
          String(c.postcode || "").toLowerCase().includes(q)
        );
      }

      list.sort((a,b) => {
        if (customerSort === "name") return String(a.name || "").localeCompare(String(b.name || ""));
        if (customerSort === "round") return String((getRoundById(a.roundId || "") || {}).name || "").localeCompare(String((getRoundById(b.roundId || "") || {}).name || ""));
        return createdTime(b) - createdTime(a);
      });

      content.innerHTML =
        '<div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm mb-4">' +
          '<div class="grid gap-3 md:grid-cols-[1fr_180px_180px]">' +
            '<input id="customerSearch" value="' + escAttr(customerSearch) + '" placeholder="Search name, address, postcode..." class="px-3 py-2 rounded-xl border border-slate-200" />' +
            '<select id="customerSort" class="px-3 py-2 rounded-xl border border-slate-200">' +
              '<option value="newest" ' + (customerSort === "newest" ? "selected" : "") + '>Newest first</option>' +
              '<option value="name" ' + (customerSort === "name" ? "selected" : "") + '>A-Z</option>' +
              '<option value="round" ' + (customerSort === "round" ? "selected" : "") + '>Round</option>' +
            '</select>' +
            '<select id="customerFilter" class="px-3 py-2 rounded-xl border border-slate-200">' +
              '<option value="active" ' + (customerFilter === "active" ? "selected" : "") + '>Active</option>' +
              '<option value="inactive" ' + (customerFilter === "inactive" ? "selected" : "") + '>Inactive</option>' +
              '<option value="all" ' + (customerFilter === "all" ? "selected" : "") + '>All</option>' +
            '</select>' +
          '</div>' +
        '</div>' +
        (list.length
          ? list.map(customerCard).join("")
          : '<div class="p-4 rounded-2xl bg-white border border-slate-200 text-slate-600">No customers found.</div>');

      $("customerSearch").addEventListener("input", e => {
        customerSearch = e.target.value;
        renderCustomers();
      });

      $("customerSort").addEventListener("change", e => {
        customerSort = e.target.value;
        renderCustomers();
      });

      $("customerFilter").addEventListener("change", e => {
        customerFilter = e.target.value;
        renderCustomers();
      });

      wireCustomerButtons();
    }

    function trialSetupProgress() {
      const activeCustomers = customers.filter(customer => customer.active !== false).length;
      const scheduledJobs = jobs.filter(job => effectiveStatus(job) === "Due" || effectiveStatus(job) === "Unpaid").length;
      const completedJobs = jobs.filter(job => effectiveStatus(job) === "Paid").length;
      const hasDueOrUnpaidToday = jobs.some(job => (effectiveStatus(job) === "Due" || effectiveStatus(job) === "Unpaid") && job.dueDate === todayISO());
      const hasCalendarWork = jobs.some(job => effectiveStatus(job) === "Due" && job.dueDate);
      const healthChecksOpened = localStorage.getItem("roundmateHealthChecksOpened") === "1";
      const hasHealthIssues = duplicateFutureJobs().length ||
        customers.filter(c => c.active !== false && !getNextJobForCustomer(c.id)).length ||
        jobs.filter(j => effectiveStatus(j) !== "Paid" && Number(j.price || 0) <= 0).length;
      const stripeLinks = companySettings.stripePaymentLinks || {};
      const hasStripe = !!String(companySettings.stripePaymentLink || "").trim() || Object.keys(stripeLinks).length > 0;
      const hasPayments = hasStripe || !!String(companySettings.goCardlessPaymentLink || "").trim() || !!String(companySettings.bacsDetails || "").trim();
      const templates = companySettings.messageTemplates || {};
      const hasMessages = Object.keys(templates).some(key => String(templates[key] || "").trim());
      const steps = [
        { label: "Add your first customer", done: activeCustomers > 0, action: "customer" },
        { label: "Add a job with the next clean date", done: scheduledJobs > 0 || completedJobs > 0, action: "job" },
        { label: "Check Today or Calendar", done: hasDueOrUnpaidToday || hasCalendarWork || completedJobs > 0, action: "calendar" },
        { label: "Add payment details or message templates", done: hasPayments || hasMessages, action: "settings" },
        { label: "Run Health Checks", done: healthChecksOpened || (!hasHealthIssues && activeCustomers > 0 && scheduledJobs > 0), action: "health" },
        { label: "Mark one job Cleaned or Paid", done: completedJobs > 0 || jobs.some(job => effectiveStatus(job) === "Unpaid"), action: "today" }
      ];
      const nextStep = steps.find(step => !step.done) || null;
      return {
        activeCustomers,
        scheduledJobs,
        completedJobs,
        steps,
        nextStep,
        doneCount: steps.filter(step => step.done).length
      };
    }

    function shouldShowTrialWelcome() {
      if (localStorage.getItem("roundmateTrialSetupHidden") === "1") return false;
      const progress = trialSetupProgress();
      if (activeTab !== "today") return false;
      if (progress.doneCount >= progress.steps.length) {
        localStorage.setItem("roundmateTrialSetupHidden", "1");
        return false;
      }
      if (progress.doneCount < progress.steps.length) return true;
      return progress.activeCustomers < 3 || progress.scheduledJobs < 3;
    }

      return '' +

          '<div class="flex items-start justify-between gap-3">' +
            '<div>' +

              '<p class="text-sm text-slate-600 mt-2">Set up your round in a few minutes. Start with one customer and one job, then import your spreadsheet when you are ready.</p>' +
            '</div>' +
            '<div class="shrink-0 text-right">' +
              '<div class="text-lg font-bold text-slate-950">' + progress.doneCount + '/' + progress.steps.length + '</div>' +
              '<div class="text-xs text-slate-500">complete</div>' +
            '</div>' +
          '</div>' +
          '<div class="mt-4 h-2 rounded-full bg-slate-100 overflow-hidden"><div class="h-full bg-sky-600" style="width:' + percent + '%"></div></div>' +
          '<div class="mt-3 p-3 rounded-xl bg-sky-50 border border-sky-100 text-sm text-sky-900"><span class="font-semibold">Next:</span> ' + escHtml(nextStepText) + '</div>' +
          '<div class="mt-4 grid gap-2 text-sm">' +
            progress.steps.map((step, index) =>
              '<div class="flex items-center gap-2 rounded-xl border ' + (step.done ? "border-emerald-100 bg-emerald-50" : "border-slate-200 bg-white") + ' p-2">' +
                '<span class="w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold ' + (step.done ? "bg-emerald-100 text-emerald-700" : "bg-slate-100 text-slate-500") + '">' + (step.done ? "OK" : "-") + '</span>' +
                '<span class="flex-1 ' + (step.done ? "text-slate-500 line-through" : "text-slate-800") + '">' + escHtml(step.label) + '</span>' +
                '<span class="text-xs text-slate-400">Step ' + (index + 1) + '</span>' +
              '</div>'
            ).join("") +
          '</div>' +
          '<div class="mt-4 grid grid-cols-1 sm:grid-cols-4 gap-2">' +
            '<button id="welcomeAddCustomer" class="px-3 py-3 rounded-xl bg-slate-900 text-white text-sm font-semibold">Add first customer</button>' +
            '<button id="welcomeAddJob" class="px-3 py-3 rounded-xl bg-white border border-slate-200 text-sm font-semibold">Add job</button>' +
            '<button id="welcomeHealth" class="px-3 py-3 rounded-xl bg-white border border-slate-200 text-sm font-semibold">Health checks</button>' +
            '<button id="welcomeGuide" class="px-3 py-3 rounded-xl bg-white border border-slate-200 text-sm font-semibold">View setup guide</button>' +
            '<button id="welcomeSampleCSV" class="px-3 py-3 rounded-xl bg-white border border-slate-200 text-sm font-semibold">Download CSV template</button>' +
          '</div>' +
          '<button id="welcomeHide" class="mt-3 w-full px-3 py-2 rounded-xl bg-white border border-slate-200 text-sm font-medium text-slate-600">Hide for now</button>' +
        '</div>';
    }

    function wireTrialWelcomeCard() {

      const sample = $("welcomeSampleCSV");

    function renderUnpaidJobs(list) {
      const total = list.reduce((sum, job) => sum + Number(job.price || 0), 0);
      const today = todayISO();
      const oldest = list.length ? sortJobsByDue(list.slice())[0] : null;
      const stripeCount = list.filter(j => paymentMethodFor(j, getCustomerById(j.customerId)) === "Stripe").length;
      const goCardlessCount = list.filter(j => paymentMethodFor(j, getCustomerById(j.customerId)) === "GoCardless").length;
      const bankCount = list.filter(j => paymentMethodFor(j, getCustomerById(j.customerId)) === "Bank transfer").length;
      const cashCount = list.filter(j => paymentMethodFor(j, getCustomerById(j.customerId)) === "Cash").length;

      const header =
        '<div class="mb-4">' +
          '<div class="flex items-end justify-between gap-3">' +
            '<div><h2 class="rm-section-title text-2xl font-bold text-slate-950">Unpaid jobs</h2><div class="text-sm text-slate-600 mt-2">Debt chasing: text reminder, mark paid, or open More for the full job.</div></div>' +
            '<div class="text-right"><div class="text-2xl font-bold text-slate-950">' + list.length + '</div><div class="text-sm text-slate-500">' + pounds(total) + '</div></div>' +
          '</div>' +

            '<div class="rounded-xl bg-white border border-slate-200 p-3"><div class="text-xs text-slate-500">Total owed</div><div class="font-bold">' + pounds(total) + '</div></div>' +
            '<div class="rounded-xl bg-white border border-slate-200 p-3"><div class="text-xs text-slate-500">Oldest</div><div class="font-bold">' + (oldest ? escHtml(formatDate(oldest.dueDate)) : "-") + '</div></div>' +
            '<div class="rounded-xl bg-white border border-slate-200 p-3"><div class="text-xs text-slate-500">Card / GC</div><div class="font-bold">' + stripeCount + ' / ' + goCardlessCount + '</div></div>' +
            '<div class="rounded-xl bg-white border border-slate-200 p-3"><div class="text-xs text-slate-500">BACS / Cash</div><div class="font-bold">' + bankCount + ' / ' + cashCount + '</div></div>' +
          '</div>' +
        '</div>';

      if (!list.length) {
        content.innerHTML = header + '<div class="p-5 rounded-lg bg-white border border-slate-200 text-slate-600">Nothing unpaid. Lovely bit of admin peace.</div>';
        return;
      }

      const sorted = sortJobsByDue(list.slice()).sort((a, b) => {
        const overdueA = String(a.dueDate || "") < today ? 0 : 1;
        const overdueB = String(b.dueDate || "") < today ? 0 : 1;
        if (overdueA !== overdueB) return overdueA - overdueB;
        return String(a.dueDate || "").localeCompare(String(b.dueDate || ""));
      });
      const groups = [
        ["GoCardless", "GoCardless"],
        ["Stripe", "Stripe"],
        ["Bank transfer", "Bank transfer"],
        ["Cash", "Cash"]
      ];
      const groupedHtml = groups.map(group => {
        const groupJobs = sorted.filter(job => paymentMethodFor(job, getCustomerById(job.customerId)) === group[0]);
        if (!groupJobs.length) return "";
        const groupTotal = groupJobs.reduce((sum, job) => sum + Number(job.price || 0), 0);
        return '<div class="mb-5">' +
          '<div class="flex items-center justify-between gap-3 mb-2">' +
            '<div class="font-bold text-slate-950">' + escHtml(group[1]) + '</div>' +
            '<div class="text-sm font-semibold text-slate-600">' + groupJobs.length + ' jobs - ' + pounds(groupTotal) + '</div>' +
          '</div>' +
          groupJobs.map(jobCard).join("") +
        '</div>';
      }).join("");
      content.innerHTML = header + groupedHtml;
      wireJobButtons();
    }

    function expenseTotals() {
      const ms = monthStartDate().getTime();
      const me = monthEndDate().getTime();
      const ys = yearStartDate().getTime();
      const ye = yearEndDate().getTime();
      let month = 0;
      let year = 0;
      expenses.forEach(expense => {
        const date = expense.date ? new Date(expense.date + "T00:00:00") : dateValue(expense.createdAt);
        if (!date) return;
        const t = date.getTime();
        const amount = Number(expense.amount || 0);
        if (t >= ms && t <= me) month += amount;
        if (t >= ys && t <= ye) year += amount;
      });
      return { month, year };
    }

    function paidTotals() {
      const ms = monthStartDate().getTime();
      const me = monthEndDate().getTime();
      const ys = yearStartDate().getTime();
      const ye = yearEndDate().getTime();
      let month = 0;
      let year = 0;
      jobs.forEach(job => {
        if (effectiveStatus(job) !== "Paid") return;
        const paidAt = dateValue(job.paidAt);
        if (!paidAt) return;
        const t = paidAt.getTime();
        const paidAmount = jobPaidAmount(job);
        if (t >= ms && t <= me) month += paidAmount;
        if (t >= ys && t <= ye) year += paidAmount;
      });
      return { month, year };
    }

    function renderStats() {
      const ms = monthStartDate().getTime();
      const me = monthEndDate().getTime();
      const ys = yearStartDate().getTime();
      const ye = yearEndDate().getTime();

      let paidMonth = 0;
      let paidYear = 0;
      let scheduledMonth = 0;
      let scheduledYear = 0;
      let projectedMonth = 0;
      let projectedYear = 0;
      let roundWeeklyValue = 0;
      let roundMonthlyValue = 0;
      let roundYearlyValue = 0;
      let expectedMonthly = 0;
      let expectedYearly = 0;
      let unpaidTotal = 0;
      const expenseSummary = expenseTotals();
      const activeCustomers = customers.filter(c => c.active !== false).length;
      const valueJobs = roundValueJobs();

      jobs.forEach(j => {
        const st = effectiveStatus(j);
        const activeCustomer = isActiveCustomer(j.customerId);

        if (st === "Unpaid") unpaidTotal += Number(j.price || 0);

        if (activeCustomer && j.dueDate) {
          const d = new Date(j.dueDate + "T00:00:00").getTime();
          if (d >= ms && d <= me && (st === "Due" || st === "Unpaid")) scheduledMonth += Number(j.price || 0);
          if (d >= ys && d <= ye && (st === "Due" || st === "Unpaid")) scheduledYear += Number(j.price || 0);
        }

        if (st === "Paid") {
          const paidAt = dateValue(j.paidAt);
          if (paidAt) {
            const t = paidAt.getTime();
            if (t >= ms && t <= me) paidMonth += jobPaidAmount(j);
            if (t >= ys && t <= ye) paidYear += jobPaidAmount(j);
          }
        }
      });

      valueJobs.forEach(j => {
        const yearly = expectedYearlyValueForJob(j);
        roundYearlyValue += yearly;
        roundWeeklyValue += yearly / 52;
      });
      roundMonthlyValue = roundYearlyValue / 12;
      expectedYearly = roundYearlyValue;
      expectedMonthly = roundMonthlyValue;
      projectedMonth = scheduledMonth + projectedWorkTotal(todayISO(monthStartDate()), todayISO(monthEndDate()));
      projectedYear = scheduledYear + projectedWorkTotal(todayISO(yearStartDate()), todayISO(yearEndDate()));

      content.innerHTML =
        '<div class="grid md:grid-cols-4 gap-3">' +
          '<div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm"><div class="text-sm text-slate-500">Paid this month</div><div class="text-2xl font-bold">' + pounds(paidMonth) + '</div></div>' +

    function duplicateFutureJobs() {
      const today = todayISO();
      const seen = new Map();
      const duplicates = [];
      jobs.forEach(job => {
        if (effectiveStatus(job) !== "Due" || String(job.dueDate || "") < today) return;
        const key = [
          job.customerId || "",
          job.service || "",
          job.dueDate || "",
          Number(job.price || 0),
          Number(job.frequencyWeeks || 0)
        ].join("|");
        if (seen.has(key)) {
          duplicates.push(job);
        } else {
          seen.set(key, job.id);
        }
      });
      return duplicates;
    }

    function renderCalendar() {
      const offset = calendarStartOffset(calYear, calMonth);
      const dim = daysInCalendarMonth(calYear, calMonth);
      const cells = [];

      for (let i = 0; i < 42; i++) {
        const dayNumber = i - offset + 1;

        if (dayNumber < 1 || dayNumber > dim) {
          cells.push('<div class="min-h-[96px] bg-white/40 border border-slate-200 rounded-2xl p-2"></div>');
          continue;
        }

        const iso = isoFromYMD(calYear, calMonth, dayNumber);
        const list = calendarJobsOnDate(iso);
        const labels = roundLabelsHtml(list);

        cells.push(
          '<button data-cal-date="' + iso + '" class="text-left min-h-[96px] bg-white border border-slate-200 rounded-2xl p-2 hover:border-slate-400">' +
            '<div class="flex items-center justify-between">' +
              '<div class="text-sm font-semibold">' + dayNumber + '</div>' +
              (list.length ? '<div class="text-[11px] px-2 py-0.5 rounded-full bg-slate-100 border border-slate-200">' + list.length + '</div>' : "") +
            '</div>' +
            '<div class="mt-1 space-y-1">' +
              (labels || '<div class="text-xs text-slate-400">No jobs</div>') +
            '</div>' +
          '</button>'
        );
      }

      content.innerHTML =
        '<div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">' +
          '<div class="flex items-center justify-between gap-3">' +
            '<div class="font-semibold text-lg">' + monthName(calMonth) + ' ' + calYear + '</div>' +
            '<div class="flex gap-2">' +
              '<button id="calPrev" class="px-3 py-2 rounded-xl bg-white border border-slate-200 text-sm">Prev</button>' +
              '<button id="calToday" class="px-3 py-2 rounded-xl bg-white border border-slate-200 text-sm">Today</button>' +
              '<button id="calNext" class="px-3 py-2 rounded-xl bg-white border border-slate-200 text-sm">Next</button>' +
            '</div>' +
          '</div>' +
          '<div class="mt-3 grid grid-cols-7 gap-2 text-xs text-slate-500">' +
            '<div class="text-center">Mon</div><div class="text-center">Tue</div><div class="text-center">Wed</div><div class="text-center">Thu</div><div class="text-center">Fri</div><div class="text-center">Sat</div><div class="text-center">Sun</div>' +
          '</div>' +
          '<div class="mt-2 grid grid-cols-7 gap-2">' + cells.join("") + '</div>' +
        '</div>';

      $("calPrev").addEventListener("click", () => {
        calMonth--;
        if (calMonth < 0) { calMonth = 11; calYear--; }
        renderCalendar();
      });

      $("calNext").addEventListener("click", () => {
        calMonth++;
        if (calMonth > 11) { calMonth = 0; calYear++; }
        renderCalendar();
      });

      $("calToday").addEventListener("click", () => {
        const d = new Date();
        calYear = d.getFullYear();
        calMonth = d.getMonth();
        renderCalendar();
      });

      content.querySelectorAll("[data-cal-date]").forEach(b => b.addEventListener("click", () => openCalendarDay(b.dataset.calDate)));
    }

    function openCalendarDay(iso) {
      activeCalendarDayIso = iso;
      const list = calendarJobsOnDate(iso).slice();
      const moveableJobs = list.filter(job => effectiveStatus(job) === "Due");
      const total = moveableJobs.reduce((sum, job) => sum + Number(job.price || 0), 0);
      const missingPostcodes = moveableJobs.filter(job => {
        const customer = getCustomerById(job.customerId);
        return !customer || !String(customer.postcode || "").trim();
      }).length;
      const missingCoordinates = moveableJobs.filter(job => !customerCoordinates(getCustomerById(job.customerId))).length;

      const rows = list.length ? list.map((j, index) => {
        const c = getCustomerById(j.customerId);
        const status = effectiveStatus(j);
        return '<div class="border border-slate-200 rounded-xl p-3">' +
          (j.projected ? '<div class="w-full text-left">' : '<button data-day-job="' + j.id + '" class="w-full text-left hover:text-slate-700">') +
            '<div class="font-semibold">' + escHtml(c && c.address ? c.address : "Unknown address") + ' - ' + pounds(j.price) + '</div>' +
            '<div class="text-sm text-slate-600">' + escHtml(j.service || "") + ' - ' + escHtml(freqLabel(j.frequencyWeeks)) + ' - ' + escHtml(j.projected ? "Projected future clean" : status) + '</div>' +
          (j.projected ? '</div>' : '</button>') +
          '<div class="mt-2 flex flex-wrap gap-2">' +
            (j.projected ? '<span class="px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-600">Planning only</span>' : '') +
            (!j.projected ? '<button data-action="moveUp" data-id="' + j.id + '" ' + (index === 0 ? "disabled" : "") + ' class="px-3 py-2 rounded-xl bg-white border border-slate-200 text-sm disabled:opacity-40">Up</button>' : '') +
            (!j.projected ? '<button data-action="moveDown" data-id="' + j.id + '" ' + (index === list.length - 1 ? "disabled" : "") + ' class="px-3 py-2 rounded-xl bg-white border border-slate-200 text-sm disabled:opacity-40">Down</button>' : '') +
            (!j.projected && status === "Due" ? '<button data-action="textTomorrowReminder" data-id="' + j.id + '" class="px-3 py-2 rounded-xl bg-sky-600 text-white text-sm font-semibold">Text due reminder</button>' : "") +
            (!j.projected && status === "Due" ? '<button data-action="tomorrowReminder" data-id="' + j.id + '" class="px-3 py-2 rounded-xl bg-white border border-slate-200 text-sm">Copy due reminder</button>' : "") +
            (!j.projected && status === "Due" ? '<button data-action="reschedule" data-id="' + j.id + '" class="px-3 py-2 rounded-xl bg-white border border-slate-200 text-sm">Reschedule</button>' : "") +
            (!j.projected && status === "Unpaid" ? '<button data-action="textPaymentReminder" data-id="' + j.id + '" class="px-3 py-2 rounded-xl bg-sky-600 text-white text-sm font-semibold">Text payment reminder</button>' : "") +
            (!j.projected && status === "Unpaid" ? '<button data-action="paymentReminder" data-id="' + j.id + '" class="px-3 py-2 rounded-xl bg-white border border-slate-200 text-sm">Copy payment reminder</button>' : "") +
            (!j.projected ? '<button data-action="deleteJob" data-id="' + j.id + '" class="px-3 py-2 rounded-xl bg-white border border-slate-200 text-sm">Delete job</button>' : '') +
          '</div>' +
        '</div>';
      }).join("") : '<div class="text-sm text-slate-500">No jobs on this date.</div>';

      openModal("Jobs on " + formatDate(iso),
        '<div class="grid gap-3">' +
          '<button id="btnPrintCalendarDaySheet" class="px-3 py-2 rounded-xl bg-white border border-slate-200 text-sm font-semibold shadow-sm">Print daily job sheet</button>' +
          '<button id="btnAddJobOnDate" class="px-3 py-2 rounded-xl bg-slate-900 text-white text-sm font-medium shadow">+ Add job on ' + formatDate(iso) + '</button>' +

    function render() {
      setTabsUI();
      renderSubhead();

      if (activeTab === "customers") { renderCustomers(); return; }
      if (activeTab === "more") { renderMore(); return; }
      if (activeTab === "route") { renderRouteOrder(); return; }
      if (activeTab === "rounds") { renderRounds(); return; }
      if (activeTab === "calendar") { renderCalendar(); return; }
      if (activeTab === "stats") { renderStats(); return; }
      if (activeTab === "expenses") { renderExpenses(); return; }
      if (activeTab === "gocardless") { renderGoCardless(); return; }
      if (activeTab === "health") {
        localStorage.setItem("roundmateHealthChecksOpened", "1");
        renderHealthChecks();
        return;
      }
      if (activeTab === "settings") { renderSettings(); return; }

      const today = todayISO();
      const weekEnd = addDaysISO(today, 6);
      let list = jobs.slice();

      if (activeTab !== "all" && activeTab !== "unpaid") {
        list = list.filter(j => isActiveCustomer(j.customerId));
      }

      if (activeTab !== "all") {
        list = list.filter(j => effectiveStatus(j) !== "Paid");
      }

      if (activeTab === "today") list = list.filter(j => effectiveStatus(j) === "Due" && j.dueDate === today);
      if (activeTab === "week") list = list.filter(j => effectiveStatus(j) === "Due" && j.dueDate >= today && j.dueDate <= weekEnd);
      if (activeTab === "overdue") list = list.filter(j => effectiveStatus(j) === "Due" && j.dueDate < today);
      if (activeTab === "unpaid") list = list.filter(j => effectiveStatus(j) === "Unpaid");

      if (activeTab === "unpaid") {
        renderUnpaidJobs(list);
        return;
      }

      renderJobs(sortJobsByDue(list));
    }

          '</label>' +
          '<button class="px-3 py-2 rounded-xl bg-slate-900 text-white text-sm font-medium shadow">Save</button>' +
        '</form>'
      );

      $("fReschedule").addEventListener("submit", async e => {
        e.preventDefault();
        const form = e.target;
        if (!setFormSaving(form, "Saving...")) return;
        try {
          const data = new FormData(form);
          const newDate = data.get("dueDate");
          const permanent = data.get("movePermanently") === "on";
          if (!String(newDate || "").trim()) {
            setNotice("Add a due date before saving this job.");
            resetFormSaving(form);
            return;
          }
          const recurrenceDay = permanent && isMonthlyFrequency(j.frequencyWeeks) ? recurrenceDayFor(j.frequencyWeeks, newDate) : (j.recurrenceDay || null);
          const scheduleAnchorDate = permanent ? null : (j.scheduleAnchorDate || j.dueDate || null);
          if (demoMode) {
            j.dueDate = newDate;
            j.routeOrder = null;
            j.scheduleAnchorDate = scheduleAnchorDate;
            j.recurrenceDay = recurrenceDay;
          } else {
            await updateDoc(doc(db, "jobs", jobId), { dueDate: newDate, routeOrder: null, scheduleAnchorDate, recurrenceDay });
            await loadJobs();
          }
          closeModal();
          render();
          setNotice(permanent ? "Job rescheduled permanently." : "Job rescheduled for this clean only.");
          setTimeout(() => setNotice(""), 3000);
        } catch (error) {
          console.error(error);
          setNotice("Could not reschedule this job. Check your connection and try again.");
          resetFormSaving(form);
        }
      });
    }

      const next = getNextJobForCustomer(c.id);

      const what3words = customerWhat3Words(c);

            (normalizePaymentMethod(c.preferredPayment) === "GoCardless" ? '<div><b>GoCardless:</b> ' + escHtml(goCardlessStatusLabel(c.goCardlessStatus)) + '</div>' : "") +

            '<div class="p-3 rounded-xl bg-slate-50 border border-slate-200"><div class="text-xs text-slate-500">Lifetime paid</div><div class="font-bold">' + pounds(stats.paid) + '</div></div>' +
            '<div class="p-3 rounded-xl bg-slate-50 border border-slate-200"><div class="text-xs text-slate-500">Unpaid</div><div class="font-bold">' + pounds(stats.unpaid) + '</div></div>' +

          '<div class="text-sm"><b>Frequency:</b> ' + (next ? escHtml(freqLabel(next.frequencyWeeks)) : "-") + '</div>' +

            '<div><b>Date:</b> ' + escHtml(formatDate(j.dueDate)) + '</div>' +

            (method === "GoCardless" && c ? '<div><b>GoCardless:</b> ' + escHtml(goCardlessStatusLabel(c.goCardlessStatus)) + '</div>' : "") +
            (warning ? '<div class="mt-2 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 text-sm p-3">' + escHtml(warning) + '</div>' : "") +
            (what3words ? '<div class="mt-2 rounded-xl bg-sky-50 border border-sky-200 text-sky-900 p-3"><b>what3words:</b> ' + escHtml(what3words) + '</div>' : "") +
            (accessNotes ? '<div class="mt-2 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 p-3"><b>Access:</b><div class="whitespace-pre-wrap">' + escHtml(accessNotes) + '</div></div>' : "") +
            (jobNotes ? '<div class="mt-2 rounded-xl bg-slate-50 border border-slate-200 text-slate-700 p-3"><b>Job note:</b><div class="whitespace-pre-wrap">' + escHtml(jobNotes) + '</div></div>' : "") +
          '</div>' +

            (status !== "Paid" ? '<button data-action="paid" data-id="' + j.id + '" class="px-3 py-2 rounded-xl bg-white border border-slate-200 text-sm">Paid</button>' : "") +
            (method === "GoCardless" && status !== "Paid" ? '<button data-action="gcRequested" data-id="' + j.id + '" ' + (gcRequested ? "disabled" : "") + ' class="px-3 py-2 rounded-xl bg-white border border-sky-200 text-sky-700 text-sm disabled:opacity-50">' + (gcRequested ? "GC requested" : "Mark GC requested") + '</button>' : "") +
            (status === "Due" ? '<button data-action="textCleaned" data-id="' + j.id + '" class="px-3 py-2 rounded-xl bg-sky-600 text-white text-sm font-semibold">Text cleaned today</button>' : "") +
            '<button data-action="cleanedText" data-id="' + j.id + '" class="px-3 py-2 rounded-xl bg-white border border-slate-200 text-sm">Copy cleaned today</button>' +
            (status === "Unpaid" ? '<button data-action="textPaymentReminder" data-id="' + j.id + '" class="px-3 py-2 rounded-xl bg-sky-600 text-white text-sm font-semibold">Text payment reminder</button>' : "") +
            (status === "Unpaid" ? '<button data-action="paymentReminder" data-id="' + j.id + '" class="px-3 py-2 rounded-xl bg-white border border-slate-200 text-sm">Copy payment reminder</button>' : "") +
            '<button data-action="reviewText" data-id="' + j.id + '" class="px-3 py-2 rounded-xl bg-white border border-slate-200 text-sm">Copy review request</button>' +
            '<button data-action="invoice" data-id="' + j.id + '" class="px-3 py-2 rounded-xl bg-white border border-slate-200 text-sm">Invoice</button>' +
            (status === "Due" ? '<button data-action="skip" data-id="' + j.id + '" class="px-3 py-2 rounded-xl bg-white border border-slate-200 text-sm">Skip</button>' : "") +
            (status === "Due" ? '<button data-action="reschedule" data-id="' + j.id + '" class="px-3 py-2 rounded-xl bg-white border border-slate-200 text-sm">Reschedule</button>' : "") +

    function downloadCSV(filename, rows) {
      if (!rows.length) {
        alert("Nothing to export.");
        return;
      }

      const headers = Object.keys(rows[0]);
      const csv = [headers.join(",")].concat(rows.map(row => {
        return headers.map(header => {
          const value = row[header] === undefined || row[header] === null ? "" : String(row[header]);
          return '"' + value.replace(/"/g, '""') + '"';
        }).join(",");
      })).join("\n");

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
    }

    function downloadJSON(filename, data) {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
    }

    function exportBackup() {
      downloadJSON("roundmate-backup-" + todayISO() + ".json", {
        exportedAt: new Date().toISOString(),
        note: "RoundMate backup export. Restore is not automatic yet; keep this file safe before imports or major changes.",
        customers,
        jobs,
        rounds,
        expenses,
        companySettings
      });
    }

    function safeJsonValue(value) {
      if (isTimestamp(value)) return value.toDate().toISOString();
      if (value instanceof Date) return value.toISOString();
      if (Array.isArray(value)) return value.map(safeJsonValue);
      if (value && typeof value === "object") {
        return Object.fromEntries(Object.entries(value).map(([key, item]) => [key, safeJsonValue(item)]));
      }
      return value;
    }

    function clearflowOwnedItems(items, ownerUserId) {
      return items.filter(item => item && item.ownerUid === ownerUserId);
    }

    function exportClearflowBusinessData() {
      const user = auth.currentUser;
      if (!user || !canExportClearflowBusinessData()) {
        setNotice("Clearflow business export is only available on the Clearflow owner account.");
        setTimeout(() => setNotice(""), 4000);
        return;
      }

      const ownerUserId = user.uid;
      const ownedCustomers = clearflowOwnedItems(customers, ownerUserId);
      const ownedJobs = clearflowOwnedItems(jobs, ownerUserId);
      const ownedRounds = clearflowOwnedItems(rounds, ownerUserId);
      const ownedExpenses = clearflowOwnedItems(expenses, ownerUserId);
      const customerById = new Map(ownedCustomers.map(customer => [customer.id, customer]));
      const roundById = new Map(ownedRounds.map(round => [round.id, round]));
      const nowIso = todayISO();
      const paidJobs = ownedJobs.filter(job => effectiveStatus(job) === "Paid");
      const unpaidJobs = ownedJobs.filter(job => effectiveStatus(job) === "Unpaid");
      const dueJobs = ownedJobs.filter(job => effectiveStatus(job) === "Due");
      const skippedJobs = ownedJobs.filter(job => job.skippedAt);
      const overdueJobs = dueJobs.filter(job => String(job.dueDate || "") < nowIso);
      const totalPaid = paidJobs.reduce((sum, job) => sum + jobPaidAmount(job), 0);
      const totalUnpaid = unpaidJobs.reduce((sum, job) => sum + Number(job.price || 0), 0);
      const totalDue = dueJobs.reduce((sum, job) => sum + Number(job.price || 0), 0);
      const totalExpenses = ownedExpenses.reduce((sum, expense) => sum + Number(expense.amount || 0), 0);

      const snapshot = {
        generatedAt: new Date().toISOString(),
        app: {
          name: "RoundMate",
          version: APP_VERSION,
          firebaseProjectId: firebaseConfig.projectId
        },
        ownerUserId,
        ownerEmail: String(user.email || "").toLowerCase(),
        summary: {
          customerCount: ownedCustomers.length,
          activeCustomerCount: ownedCustomers.filter(customer => customer.active !== false).length,
          inactiveCustomerCount: ownedCustomers.filter(customer => customer.active === false).length,
          jobCount: ownedJobs.length,
          dueJobCount: dueJobs.length,
          unpaidJobCount: unpaidJobs.length,
          paidJobCount: paidJobs.length,
          skippedJobCount: skippedJobs.length,
          overdueJobCount: overdueJobs.length,
          roundCount: ownedRounds.length,
          expenseCount: ownedExpenses.length,
          totalDue,
          totalUnpaid,
          totalPaid,
          totalExpenses,
          profitAfterExpenses: totalPaid - totalExpenses
        },
        customers: ownedCustomers.map(customer => {
          const round = roundById.get(customer.roundId || "");
          const stats = customerStats(customer.id);
          const next = getNextJobForCustomer(customer.id);
          return safeJsonValue({
            id: customer.id,
            ownerUid: customer.ownerUid,
            name: customer.name || "",
            address: customer.address || "",
            postcode: customer.postcode || "",
            area: customer.area || "",
            phone: customer.phone || "",
            email: customer.email || "",
            what3words: customer.what3words || "",
            latitude: customer.latitude || "",
            longitude: customer.longitude || "",
            price: next ? Number(next.price || 0) : "",
            frequencyWeeks: next ? next.frequencyWeeks || "" : "",
            frequency: next ? freqLabel(next.frequencyWeeks) : "",
            paymentMethod: customer.preferredPayment || "",
            status: customer.active === false ? "inactive" : "active",
            notes: customer.notes || "",
            source: customer.source || "",
            startDate: customer.customerSince || "",
            customerSince: customer.customerSince || "",
            roundId: customer.roundId || "",
            round: round && round.name ? round.name : "",
            nextCleanDate: next ? next.dueDate || "" : "",
            yearlyValueEstimate: customerAnnualValue(customer.id),
            lifetimePaidValue: stats.paid || 0,
            unpaidValue: stats.unpaid || 0,
            cleansCompleted: stats.cleans || 0,
            createdAt: customer.createdAt || "",
            updatedAt: customer.updatedAt || ""
          });
        }),
        jobs: ownedJobs.map(job => {
          const customer = customerById.get(job.customerId);
          const round = roundById.get(job.roundId || (customer && customer.roundId) || "");
          const status = effectiveStatus(job);
          return safeJsonValue({
            id: job.id,
            ownerUid: job.ownerUid,
            customerId: job.customerId || "",
            customerName: customer && customer.name ? customer.name : "",
            address: customer && customer.address ? customer.address : "",
            postcode: customer && customer.postcode ? customer.postcode : "",
            area: customer && customer.area ? customer.area : "",
            phone: customer && customer.phone ? customer.phone : "",
            email: customer && customer.email ? customer.email : "",
            service: job.service || "",
            scheduledDate: job.dueDate || "",
            dueDate: job.dueDate || "",
            completedDate: job.completedAt || job.doneAt || "",
            jobStatus: status,
            paidStatus: status === "Paid" ? "paid" : "unpaid",
            paid: !!job.paid,
            amount: status === "Paid" ? jobPaidAmount(job) : Number(job.price || 0),
            scheduledAmount: Number(job.price || 0),
            paymentMethod: paymentMethodFor(job, customer),
            frequencyWeeks: job.frequencyWeeks || "",
            frequency: freqLabel(job.frequencyWeeks),
            skipped: !!job.skippedAt,
            skippedAt: job.skippedAt || "",
            overdue: status === "Due" && String(job.dueDate || "") < nowIso,
            roundId: job.roundId || "",
            round: round && round.name ? round.name : "No round",
            notes: job.notes || "",
            customerNotes: customer && customer.notes ? customer.notes : "",
            createdAt: job.createdAt || "",
            updatedAt: job.updatedAt || ""
          });
        }),
        skippedJobs: skippedJobs.map(job => safeJsonValue({ id: job.id, customerId: job.customerId || "", dueDate: job.dueDate || "", skippedAt: job.skippedAt || "", amount: Number(job.price || 0) })),
        overdueJobs: overdueJobs.map(job => {
          const customer = customerById.get(job.customerId);
          return safeJsonValue({ id: job.id, customerId: job.customerId || "", address: customer && customer.address ? customer.address : "", dueDate: job.dueDate || "", amount: Number(job.price || 0) });
        }),
        rounds: ownedRounds.map(round => safeJsonValue({
          id: round.id,
          ownerUid: round.ownerUid,
          name: round.name || "",
          color: round.color || "",
          area: round.area || "",
          createdAt: round.createdAt || ""
        })),
        expenses: ownedExpenses.map(expense => safeJsonValue({
          id: expense.id,
          ownerUid: expense.ownerUid,
          date: expense.date || "",
          amount: Number(expense.amount || 0),
          category: expense.category || "",
          note: expense.note || "",
          createdAt: expense.createdAt || "",
          updatedAt: expense.updatedAt || ""
        })),
        leadOrQuoteData: {
          note: "No separate lead or quote collection was found in this app. Customer source fields are included on customers."
        },
        settingsSummary: {
          hasStripeFallbackLink: !!String(companySettings.stripePaymentLink || "").trim(),
          stripePriceLinkCount: Object.values(companySettings.stripePaymentLinks || {}).filter(value => String(value || "").trim()).length,
          hasGoCardlessSetupLink: !!String(companySettings.goCardlessPaymentLink || "").trim(),
          hasBacsDetails: !!String(companySettings.bacsDetails || "").trim(),
          hasReviewLink: !!String(companySettings.reviewLink || "").trim()
        }
      };

      downloadJSON("clearflow_business_snapshot.json", snapshot);
      setNotice("Clearflow business snapshot downloaded. It only includes records owned by your signed-in account.");
      setTimeout(() => setNotice(""), 5000);
    }

      const activeCustomers = customers.filter(c => c.active !== false).length;

      const unpaidJobs = jobs.filter(j => effectiveStatus(j) === "Unpaid").length;
      return [
        "RoundMate support report",
        "App version: " + APP_VERSION,
        "Date/time: " + new Date().toLocaleString(),
        "Current tab: " + activeTab,
        "Live data mode: " + (demoMode ? "no" : "yes"),
        "Customers: " + customers.length + " total / " + activeCustomers + " active",
        "Jobs: " + jobs.length + " total / " + dueJobs + " due / " + unpaidJobs + " unpaid",
        "Browser: " + navigator.userAgent,
        "",
        "What happened:",
        "",
        "What I expected:",
        "",
        "Steps to repeat:"
      ].join("\n");
    }

    function copyBugReport() {
      copyToClipboard(bugReportText());
    }

    function exportCustomers() {
      const rows = customers.map(c => {
        const r = getRoundById(c.roundId || "");
        const s = customerStats(c.id);
        return {
          name: c.name || "",
          phone: c.phone || "",
          email: c.email || "",
          address: c.address || "",
          postcode: c.postcode || "",
          what3words: c.what3words || "",
          latitude: c.latitude || "",
          longitude: c.longitude || "",
          payment: c.preferredPayment || "",
          source: c.source || "",
          customerSince: c.customerSince ? formatDate(c.customerSince) : "",
          round: r ? r.name : "",
          notes: c.notes || "",
          active: c.active !== false ? "active" : "disabled",
          cleans: s.cleans,
          paidTotal: s.paid,
          unpaidTotal: s.unpaid
        };
      });

      downloadCSV("roundmate-customers.csv", rows);
    }

    function exportJobs() {
      const rows = jobs.map(j => {
        const c = getCustomerById(j.customerId);
        const r = getRoundById(j.roundId || "");

        return {
          customerName: c && c.name ? c.name : "",
          address: c && c.address ? c.address : "",
          postcode: c && c.postcode ? c.postcode : "",
          what3words: c && c.what3words ? c.what3words : "",
          service: j.service || "",
          dueDate: formatDate(j.dueDate),
          frequency: freqLabel(j.frequencyWeeks),
          price: j.price || "",
          status: effectiveStatus(j),
          paid: j.paid ? "yes" : "no",
          paymentMethod: j.paymentMethod || "",
          round: r && r.name ? r.name : "",
          notes: j.notes || ""
        };
      });

      downloadCSV("roundmate-jobs.csv", rows);
    }

    function exportExpenses() {
      const rows = expenses.map(expense => ({
        date: formatDate(expense.date),
        amount: Number(expense.amount || 0).toFixed(2),
        category: expense.category || "",
        note: expense.note || ""
      }));

      downloadCSV("roundmate-expenses.csv", rows);
    }

    function wireExportButtons() {
      const exportCustomersButton = $("btnExportCustomers");
      const exportJobsButton = $("btnExportJobs");
      const exportClearflowButton = $("btnExportClearflowBusiness");
      if (exportCustomersButton) exportCustomersButton.addEventListener("click", exportCustomers);
      if (exportJobsButton) exportJobsButton.addEventListener("click", exportJobs);
      if (exportClearflowButton) exportClearflowButton.addEventListener("click", exportClearflowBusinessData);
    }

    document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
      activeTab = b.dataset.tab;
      render();
    }));

    $("btnAddCustomer").addEventListener("click", openAddCustomer);
    $("btnAddJob").addEventListener("click", () => openAddJob());
    $("btnAccount").addEventListener("click", openAccountModal);

    async function handleAuthStateChange(user) {
      if (demoMode) return;
      if (!user) {
        uid = null;
        accountProfile = null;
        customers = [];
        jobs = [];
        rounds = [];
        renderAuthStatus();
        renderAccessScreen();
        return;
      }
      if (user.isAnonymous) {
        await signOut(auth);
        return;
      }
      try {
        await handleAuthenticatedUser(user);
      } catch (error) {
        console.error(error);
        subhead.textContent = "Account access error";
        const permissionHint = error && String(error.message || "").toLowerCase().includes("permission")
          ? '<div class="mt-2 text-sm">This usually means the Firestore rules for accountProfiles have not been published for this Firebase project yet.</div>'
          : "";
        content.innerHTML =
          '<div class="p-4 rounded-lg bg-red-50 border border-red-200 text-red-900">' +
            '<div class="font-semibold">RoundMate could not check this account.</div>' +
            permissionHint +
            '<div class="mt-2 text-sm break-all">Support ID: ' + escHtml(user.uid) + '</div>' +
          '</div>';
      }
    }

    async function boot() {
      demoMode = false;
      localStorage.removeItem("roundmateDemoMode");
      subhead.textContent = "Checking account...";
      renderAuthStatus();
      setAppControlsEnabled(false);
      try {
        await setPersistence(auth, browserLocalPersistence);
      } catch (error) {
        console.warn("Could not set persistent login storage.", error);
      }
      onAuthStateChanged(auth, handleAuthStateChange);
    }

    boot();
  </script>
